version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio_db']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  # Redis In-Memory Caching Layer Container
  redis:
    image: redis:7-alpine
    container_name: portfolio_redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  # NestJS Backend Application Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: always
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/portfolio_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: 'http://localhost:5173,http://localhost:5174'
      JWT_SECRET: ritik_portfolio_super_secure_jwt_secret_2026
      ADMIN_USERNAME: ritik
      ADMIN_PASSWORD: '$Ritik5$Portfolio9$'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  portfolio_net:
    driver: bridge
